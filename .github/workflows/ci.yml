name: CI

# Corre en cada push y cada pull request, sin filtro de ruta: la pregunta que
# responde es "¿rompí algo?", no "¿esto necesita llegar a producción?".
# Siempre en runners alojados por GitHub, nunca en el runner autoalojado de
# despliegue — este workflow reacciona a pull_request, que puede venir de un
# fork.
on:
  push:
  pull_request:
  workflow_dispatch: # Enables manual triggering

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dnd_engine:
    name: dnd_engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dnd_engine
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test

  dnd_app:
    name: dnd_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dnd_app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  dnd_server:
    name: dnd_server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dnd_server
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze
      - run: dart test
